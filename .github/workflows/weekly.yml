name: Weekly Photo Brief

on:
  schedule:
    # 每周一 01:17 UTC ≈ 北京时间 09:17，避开整点高峰
    - cron: "17 1 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet feedparser

      - name: Fetch & build brief
        env:
          WINDOW_DAYS: "9"
        run: python fetch.py

      - name: Commit brief
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add briefs docs
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "brief: $(date -u +%Y-%m-%d)"
            git push
          fi
